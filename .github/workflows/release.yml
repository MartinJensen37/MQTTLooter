name: Release

# Pushing a version tag such as v1.2.0 or v1.3.0-beta.1 builds the Windows installer and drafts
# a GitHub release with the changelog entry, the installer and the update feed (latest.yml).
# Review the draft, tick "Set as a pre-release" for beta tags, and publish it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # The interoperability tests run against a real broker when one is installed.
      - name: Install Mosquitto
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://mosquitto.org/files/binary/win64/mosquitto-2.0.22-install-windows-x64.exe -OutFile mosquitto-setup.exe
          Start-Process ./mosquitto-setup.exe -ArgumentList '/S' -Wait
          if (!(Test-Path 'C:/Program Files/mosquitto/mosquitto.exe')) { exit 1 }
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Electron tests
        run: npm run test:electron
        env:
          SMOKE_TIMEOUT_MS: 180000
      - name: Release notes
        shell: bash
        run: node scripts/release-notes.cjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Build and draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing with Azure Trusted Signing, used once these secrets exist.
          # See docs/RELEASING.md.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_PUBLISHER: ${{ secrets.SIGNING_PUBLISHER }}
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          signing=()
          if [ -n "$AZURE_CLIENT_ID" ]; then
            signing=(
              "--config.win.azureSignOptions.publisherName=$SIGNING_PUBLISHER"
              "--config.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT"
              "--config.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT"
              "--config.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"
            )
          fi
          npx electron-vite build
          npx electron-builder --win --publish always \
            --config.releaseInfo.releaseNotesFile=release-notes.md "${signing[@]}"
