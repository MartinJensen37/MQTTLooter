name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The interoperability tests run against a real broker when one is installed.
      - name: Install Mosquitto
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://mosquitto.org/files/binary/win64/mosquitto-2.0.22-install-windows-x64.exe -OutFile mosquitto-setup.exe
          Start-Process ./mosquitto-setup.exe -ArgumentList '/S' -Wait
          if (!(Test-Path 'C:/Program Files/mosquitto/mosquitto.exe')) { exit 1 }
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx,js,jsx,css}" "tests/**/*.{ts,tsx,cjs}"
      - run: npm test
      - name: Electron tests
        run: npm run test:electron
        env:
          SMOKE_TIMEOUT_MS: 180000
      # Fails when input latency, disconnect time or heap size miss their targets under load.
      - name: Load test
        run: npm run test:load
        env:
          LOAD_STRICT: 1
      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-report
          path: .tmp/load-report-*.json
          if-no-files-found: ignore
      - name: Upload Electron screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-screenshots
          path: .tmp/*.png
          if-no-files-found: ignore
